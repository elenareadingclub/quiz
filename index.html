<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>ERC 단어 퀴즈</title>
<style>
  :root{--bg:#FBF7F0; --ink:#2B2620; --soft:#6B6254; --line:#E7DECE;}
  @media (prefers-color-scheme: dark){ :root{--bg:#17140F; --ink:#F3EBDC; --soft:#C9BCA5; --line:#3A3326; color-scheme:dark;} }
  body{background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  .wrap{max-width:520px; margin:0 auto; padding-inline:16px; padding-block:40px;}
  h1{font-size:28px; margin:0 0 6px;}
  p{color:var(--soft); margin:0 0 24px;}
  .lv{display:flex; align-items:center; gap:14px; text-decoration:none; color:var(--ink); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px;}
  .badge{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:800;}
  .lv b{font-size:18px;}
</style>
<div class="wrap">
  <h1>ERC 단어 퀴즈</h1>
  <p>내 레벨을 눌러서 시작해요.</p>
  <a class="lv" href="./B/"><span class="badge" style="background:#F39C12;color:#2B2620">B</span><b>B레벨</b></a>
  <a class="lv" href="./C/"><span class="badge" style="background:#F1C40F;color:#2B2620">C</span><b>C레벨</b></a>
  <a class="lv" href="./D/"><span class="badge" style="background:#27AE60;color:#FFFFFF">D</span><b>D레벨</b></a>
  <a class="lv" href="./E/"><span class="badge" style="background:#2980B9;color:#FFFFFF">E</span><b>E레벨</b></a>
  <a class="lv" href="./F/"><span class="badge" style="background:#2C3373;color:#FFFFFF">F</span><b>F레벨</b></a>
  <a class="lv" href="./G/"><span class="badge" style="background:#795548;color:#FFFFFF">G</span><b>G레벨</b></a>
  <a class="lv" href="./H/"><span class="badge" style="background:#D81B60;color:#FFFFFF">H</span><b>H레벨</b></a>
</div>
<script>
// ===== AUTO_UPDATE (요구사항 NF-09): 첫 화면도 새 버전이면 한 번 다시 불러온다
(function () {
  var APP_BUILD = '20261018-213109', KEY = 'root_quiz_reload', RETRY = 600000;
  if (!/github\.io$/.test(location.hostname)) return;
  function check() {
    if (document.hidden) return;
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (v) {
      if (!v || !v.build || String(v.build) === APP_BUILD) return;
      var t = null; try { t = JSON.parse(sessionStorage.getItem(KEY) || 'null'); } catch (e) {}
      if (t && t.build === String(v.build) && Date.now() - t.at < RETRY) return;
      try { sessionStorage.setItem(KEY, JSON.stringify({ build: String(v.build), at: Date.now() })); } catch (e) {}
      var u = new URL(location.href); u.searchParams.set('v', String(v.build)); location.replace(u.toString());
    }).catch(function () {});
  }
  check();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  window.addEventListener('pageshow', function (e) { if (e.persisted) check(); });
})();
</script>
</body>
</html>
